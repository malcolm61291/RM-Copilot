[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-crm-agent"
version = "0.1.0"
description = "Conversational agentic AI that helps a bank Relationship Manager find, prioritise and engage customers."
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.0",
  "pydantic>=2.6",
  "pandas>=2.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "rich>=13",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8"]

[project.scripts]
rm-copilot = "crm_agent.interface.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crm_agent = ["data/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
